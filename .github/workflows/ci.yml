name: ML Pipeline Automation

on:
  push:
    paths:
      - "data/*.csv"
      - "src/**"
  workflow_dispatch:

jobs:
  run-ml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        persist-credentials: true  # allows git-auto-commit-action to push

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Preprocessing
      run: python src/preprocess.py

    - name: Train Model
      run: python src/train.py

    - name: Evaluate Models
      run: python src/evaluate.py

    - name: Select Best Model
      run: python src/save_artifacts.py

    - name: Wait for files to flush
      run: sleep 2  # ensures all newly created files are fully saved

    - name: Push Updated Artifacts
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update: processed data, models, and metrics"
        file_pattern: |
          data/processed/**
          artifacts/**
          models/**
        add_options: --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
