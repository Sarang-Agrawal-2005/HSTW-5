name: ML Pipeline Automation

on:
  push:
    paths:
      - "data/*.csv"
      - "src/**"
  workflow_dispatch:

jobs:
  run-ml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4         
      with:
        persist-credentials: true
        fetch-depth: 0                  

    - name: Set up Python
      uses: actions/setup-python@v5     
      with:
        python-version: "3.10"

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Preprocessing
      run: python src/preprocess.py

    - name: Train Model
      run: python src/train.py

    - name: Evaluate Models
      run: python src/evaluate.py

    - name: Select Best Model
      run: python src/save_artifacts.py

    - name: Push Updated Artifacts
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Force-add ALL target directories (bypasses .gitignore)
        git add --force data/processed/
        git add --force artifacts/
        git add --force models/

        # Only commit if there's something staged
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Auto-update: processed data, models, and metrics"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
